<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tab Tosser Setup</title> <!-- Will be replaced by JS -->
	<link rel="stylesheet" href="./styles.css">
	<script type="module" src="./slider.js"></script>
	<script type="module" src="./closed-tabs.js"></script>
	<script type="module" src="./open-tabs.js"></script>
	<script type="module" src="./first-run.js"></script>
</head>

<body>
	<!-- Rest remains the same -->
	<div class="container">
		<header class="welcome-hero fade-in">
			<div class="welcome-icon">
				<img src="../icon.svg" alt="Tab Tosser Icon">
			</div>
			<h1 data-i18n="setupTitle">Tab Tosser Setup</h1>
			<p class="welcome-subtitle" data-i18n="extensionDescription">Automatically close tabs that have been ignored for
				too long. Free yourself of digital clutter.</p>
		</header>

		<form id="settings" class="setup-form">
			<section class="card">
				<h2 data-i18n="closeTabsLegend">Close tabs</h2>
				<div id="ttlOptions" class="radio-group"></div>
			</section>

			<div class="setup-description">
				<p data-i18n="settingsChangeNote">You can change this setting later and view recently tossed tabs in the
					extension preferences.</p>
				<p data-i18n="noImmediateClose">No tabs will be closed immediately.</p>
			</div>
		</form>
	</div>
</body>

</html>
